[package]
name = "componentized-services"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace]
members = [
    "components/credential-config",
    "components/filesystem-credential-admin",
    "components/filesystem-credential-store",
    "components/filesystem-lifecycle",
    "components/internal-valkey-lifecycle",
    "components/keyvalue-credential-admin",
    "components/keyvalue-credential-store",
    "components/lifecycle-host-cli",
    "components/lifecycle-host-http",
    "components/test-filesystem-ops",
    "components/test-keyvalue-ops",
    "components/test-lifecycle-router",
    "components/test-ops-router",
    "components/test-service-cli",
    "components/test-stub-client",
    "components/test-stub-credential-admin",
    "components/test-stub-credential-store",
    "components/test-stub-lifecycle",
    "components/webhook-credential-admin",
    "components/webhook-credential-store",
]

[workspace.dependencies]
chrono = { git = "https://github.com/chronotope/chrono.git", branch = "0.5.x" }
serde_json = "1.0"
wit-bindgen = "0.61.0"
